          - Fine-tuned Qwen 2.5 1.5B with Unsloth and integrated LangChain with Pinecone for context-aware responses.

      - name: Secure Multi-Tenant RAG System
        summary: Built a secure LLaMA 3 RAG system with role-based access over tenant-specific document stores.
        highlights:
          - Implemented metadata-filtered retrieval in ChromaDB for secure role-specific results.
          - Built FastAPI and Streamlit stack with session persistence and login-gated access.

      - name: Smart Product Pricing Ensemble Model
        summary: Designed a multimodal ensemble model for product pricing prediction in Amazon ML Challenge 2025.
        highlights:
          - Ranked 52 out of 9000+ teams (Top 0.6%).
          - Built DeBERTa, ELECTRA, and CLIP-ViT dual-stream architecture with attention-based fusion.

