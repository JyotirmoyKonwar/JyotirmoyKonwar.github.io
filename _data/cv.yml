    Projects:
      - name: Teaching Gemma-3 to Reason
        url: https://github.com/JyotirmoyKonwar/Tunix_Gemma3
        summary: 3-stage SFT + GRPO fine-tuning pipeline for reasoning in Gemma-3.
        highlights:
          - Drove a **12% gain in answer accuracy** and a **47% surge in reasoning quality**.
          - Developed a custom composite reward function with weighted objectives (logical coherence, mathematical precision, strict XML compliance).

      - name: Dynamic Model Router for Tau
        summary: Runtime LLM routing engine for the Tau coding agent.
        highlights:
          - Dynamically selects models based on task complexity, context-window requirements, latency, cost, and model capabilities through configurable routing policies.
          - Modular routing layer with session-aware model switching, fallback handling, and observability hooks, decoupled from the core agent loop.

      - name: Secure Multi-Tenant RAG System
        url: https://github.com/JyotirmoyKonwar/Role_based_Agentic_Chatbot
        summary: Enterprise RAG pipeline with role-based access control.
        highlights:
          - Built with **LLaMA 3** and **ChromaDB**, enforcing granular **RBAC** via metadata filtering for strict multi-tenant data isolation.
          - High-throughput **FastAPI** microservices with a **Streamlit** frontend and stateful session management.

      - name: DarkGuardRL
        url: https://github.com/JyotirmoyKonwar/Eno_E
        summary: Self-play RL for dark pattern detection with Qwen3-4B (SFT + GRPO).
        highlights:
          - Designed a Gym-compatible RL environment with discrete, verifiable reward functions for adversarial decision-making.
          - Achieved a **+30–50 ELO improvement** over baseline within 500 training steps with strict multi-objective reward shaping.

      - name: Voice-Powered Multimodal RAG Agent
        url: https://github.com/JyotirmoyKonwar/Voice-MultiMod-RAG-Agentina
        summary: Agentic RAG system with LangGraph and NVIDIA Nemotron for voice-driven multimodal retrieval.
        highlights:
          - ReAct-based agentic loop with cross-encoder reranking and Llama-3.1-Nemotron-Safety-Guard for PII detection and content moderation.

      - name: LLM-Augmented Graph Neural Network for Fraud Detection
        url: https://github.com/JyotirmoyKonwar/LLM_Enhanced_GNN_Fraud_Detection
        summary: SLM + Skip-GNN architecture for text-attributed graph fraud detection.
        highlights:
          - Alternating PEFT/LoRA fine-tuning of an SLM with a composite loss and semantic k-hop neighbor sampling.
          - Dual-branch Skip-GNN with multi-head attention fusion, outperforming GCN/GAT baselines by **5% AUC-ROC/F1**.

      - name: Diffusion Language Model from Scratch
        url: https://github.com/JyotirmoyKonwar/Tiny_Stories_Diffusion
        summary: Discrete non-autoregressive diffusion LM trained on TinyStories.
        highlights:
          - Parallel, confidence-based iterative unmasking with SwiGLU, RoPE, and BPE tokenization in PyTorch.
          - Reached a perplexity of **18.88**, outperforming GPT-2's baseline of 19.93.

      - name: Smart Product Pricing Ensemble Model
        url: https://github.com/JyotirmoyKonwar/Amazon_ML_Challenge_2025
        summary: Multimodal pricing model for Amazon ML Challenge 2025.
        highlights:
          - Ranked **52 out of 9,000+ teams (Top 0.6%)**.
          - Dual-stream DeBERTa, ELECTRA, and CLIP-ViT architecture with attention-based fusion and residual blocks.

      - name: Agent Derma Doc Chatbot
        url: https://github.com/JyotirmoyKonwar/Agent_Derma_Doc_Chat
        summary: Multimodal medical agent deployed on Hugging Face Spaces.
        highlights:
          - Fine-tuned Swin Transformer for skin disease classification with a Gradio interface.
          - Fine-tuned Qwen-2.5-1.5B with Unsloth and a LangChain RAG pipeline over Pinecone for medical QA.

